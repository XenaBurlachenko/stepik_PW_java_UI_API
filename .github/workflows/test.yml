name: Test

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: Build project
      run: mvn compile test-compile
    
    - name: Install Playwright
      run: |
        # Устанавливаем Playwright и браузеры
        mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install" -q
        mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install-deps" -q
    
    - name: Run tests
      run: mvn test -Dtest=StatusCodeApiUiTest -Dheadless=true
      continue-on-error: true
    
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: TestReports
        path: |
          target/surefire-reports/
          target/failsafe-reports/
        retention-days: 14
